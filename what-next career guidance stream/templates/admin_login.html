{% extends "base.html" %}
{% block title %}Admin Login — What Next?{% endblock %}
{% block content %}
<section class="auth-section">
    <div class="container narrow">
        <div class="auth-card">
            <h1>Admin Login</h1>
            <p class="auth-sub">Restricted access for site administrators.</p>
            <form method="POST" action="{{ url_for('admin_login') }}" class="form">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required>

                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>

                <button type="submit" class="btn btn-primary btn-full">Login as Admin</button>
            </form>
        </div>
    </div>
</section>
{% endblock %}
